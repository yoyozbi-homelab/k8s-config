apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wordpress

bases:
  - ../../../../../apps/wordpress/

resources:
  - namespace.yaml
  - pv.yaml
  - pvc.yaml
  - secrets/db-secret.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: wordpress
    patch: |-
      - op: replace
        path: /spec/values/ingress/main/enabled
        value: true
      - op: add
        path: /spec/values/ingress/main/annotations
        value:
          traefik.ingress.kubernetes.io/router.entrypoints: web
      - op: add
        path: /spec/values/ingress/main/hosts
        value:
          - host: teamsolid.ch
            paths:
              - path: /
                pathType: Prefix
      - op: replace
        path: /spec/values/persistence/data/type
        value: persistentVolumeClaim
      - op: add
        path: /spec/values/persistence/data/existingClaim
        value: wordpress-data
      - op: add
        path: /spec/values/defaultPodOptions
        value:
          nodeSelector:
            kubernetes.io/hostname: ocr1
      - op: add
        path: /spec/values/controllers/main/containers/main/env/WORDPRESS_CONFIG_EXTRA
        value: |
          if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
              $_SERVER['HTTPS'] = 'on';
          }
          // Derive the site URL from the incoming request rather than pinning it to
          // teamsolid.ch. Pinned, WordPress bounces every request made on any other
          // hostname straight back to teamsolid.ch, which makes the site impossible
          // to install or browse before the domain is mapped. Deriving it means the
          // site works on whatever host reaches it - a port-forward, a Pangolin
          // resource - and keeps working unchanged once teamsolid.ch is pointed here.
          if (!empty($_SERVER['HTTP_HOST'])) {
              define('WP_HOME', (empty($_SERVER['HTTPS']) ? 'http://' : 'https://') . $_SERVER['HTTP_HOST']);
              define('WP_SITEURL', WP_HOME);
          }

  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: mariadb
    patch: |-
      - op: replace
        path: /spec/values/persistence/data/type
        value: persistentVolumeClaim
      - op: add
        path: /spec/values/persistence/data/existingClaim
        value: wordpress-db
      - op: add
        path: /spec/values/defaultPodOptions/nodeSelector
        value:
          kubernetes.io/hostname: ocr1

commonLabels:
  app.kubernetes.io/name: wordpress
  app.kubernetes.io/part-of: wordpress
