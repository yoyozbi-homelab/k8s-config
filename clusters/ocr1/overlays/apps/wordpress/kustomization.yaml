apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wordpress

bases:
  - ../../../../../apps/wordpress/

resources:
  - namespace.yaml
  - pv.yaml
  - pvc.yaml
  - secrets/db-secret.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: wordpress
    patch: |-
      - op: replace
        path: /spec/values/ingress/main/enabled
        value: true
      - op: add
        path: /spec/values/ingress/main/annotations
        value:
          traefik.ingress.kubernetes.io/router.entrypoints: web
      - op: add
        path: /spec/values/ingress/main/hosts
        value:
          - host: teamsolid.ch
            paths:
              - path: /
                pathType: Prefix
      - op: replace
        path: /spec/values/persistence/data/type
        value: persistentVolumeClaim
      - op: add
        path: /spec/values/persistence/data/existingClaim
        value: wordpress-data
      - op: add
        path: /spec/values/defaultPodOptions
        value:
          nodeSelector:
            kubernetes.io/hostname: ocr1
      - op: add
        path: /spec/values/controllers/main/containers/main/env/WORDPRESS_CONFIG_EXTRA
        value: |
          if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
              $_SERVER['HTTPS'] = 'on';
          }
          // Follow the host the request arrived on, so a port-forward or any new
          // hostname works without WordPress redirecting to teamsolid.ch.
          //
          // The scheme defaults to https on purpose. Pangolin terminates TLS but
          // does not pass X-Forwarded-Proto through the newt tunnel, so an absent
          // header says nothing about how the browser connected - treating it as
          // plain http rewrote all ~83k stored https:// URLs to http:// and the
          // browser blocked the images as mixed active content. Only hosts that
          // genuinely have no certificate (a port-forward, a kubelet probe hitting
          // the pod IP) get http.
          if (!empty($_SERVER['HTTP_HOST'])) {
              $host  = $_SERVER['HTTP_HOST'];
              $local = preg_match('/^(localhost|127\.0\.0\.1|\[::1\]|\d+\.\d+\.\d+\.\d+)(:\d+)?$/', $host);
              $scheme = ($local && empty($_SERVER['HTTPS'])) ? 'http' : 'https';
              define('WP_HOME', $scheme . '://' . $host);
              define('WP_SITEURL', WP_HOME);
          }

  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: mariadb
    patch: |-
      - op: replace
        path: /spec/values/persistence/data/type
        value: persistentVolumeClaim
      - op: add
        path: /spec/values/persistence/data/existingClaim
        value: wordpress-db
      - op: add
        path: /spec/values/defaultPodOptions/nodeSelector
        value:
          kubernetes.io/hostname: ocr1

commonLabels:
  app.kubernetes.io/name: wordpress
  app.kubernetes.io/part-of: wordpress
