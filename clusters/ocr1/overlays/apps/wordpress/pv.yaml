apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-data
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: wordpress
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  # Empty class disables dynamic provisioning so this binds statically to the
  # PVC instead of longhorn handing out a new volume.
  storageClassName: ""
  # Keep the data on disk if the PVC is ever deleted - uploads, themes and
  # plugins under wp-content exist nowhere else.
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/wordpress
    type: DirectoryOrCreate
  # ocr1 is multi-node and a hostPath only exists on one host. Without this the
  # scheduler could place the pod on tiny1/tiny2 and silently serve an empty
  # docroot. Must stay in sync with the nodeSelector in kustomization.yaml.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ocr1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-db
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: wordpress
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/wordpress-db
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ocr1
