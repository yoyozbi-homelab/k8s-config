apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dozzle

bases:
  - ../../../../../apps/dozzle

resources:
  - namespace.yaml

patches:
  - target:
      kind: Ingress
      name: dozzle-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dozzle.yohanzbinden.ch
