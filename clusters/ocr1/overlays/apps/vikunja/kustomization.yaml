apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vikunja

bases:
  - ../../../../../apps/vikunja/

resources:
  - namespace.yaml
  - secrets/db-secret.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: vikunja
    patch: |-
      - op: replace
        path: /spec/values
        value:
          vikunja:
            persistence:
              data:
                enabled: true
                accessMode: ReadWriteMany
                size: 3Gi
                storageClass: longhorn
              database:
                enabled: false
            configMaps:
              config:
                enabled: false
            ingress:
              main:
                enabled: true
                ingressClassName: traefik
                hosts:
                  - host: tasks.yohanzbinden.ch
                    paths:
                      - path: /
            env:
              VIKUNJA_SERVICE_ENABLEREGISTRATION: false
              VIKUNJA_SERVICE_PUBLICURL: https://tasks.yohanzbinden.ch
              VIKUNJA_DATABASE_TYPE: postgres
              VIKUNJA_DATABASE_USER: vikunja
              VIKUNJA_DATABASE_NAME: vikunja
              VIKUNJA_DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-db-secret
                    key: password
              VIKUNJA_DATABASE_HOST: main-cluster-rw.cnpg-system.svc.cluster.local

commonLabels:
  app.kubernetes.io/name: vikunja
  app.kubernetes.io/part-of: vikunja
