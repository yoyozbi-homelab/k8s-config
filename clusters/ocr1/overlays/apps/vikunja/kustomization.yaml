apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vikunja

helmCharts:
  - name: vikunja
    repo: https://schmitzis.github.io/helm-charts/
    version: 1.0.0
    releaseName: vikunja
    valuesFile: values-merged.yaml

# Include cluster-specific secrets
resources:
  - secrets/db-secret.yaml

commonLabels:
  app.kubernetes.io/name: vikunja
  app.kubernetes.io/part-of: vikunja
