apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vikunja

bases:
  - ../../../../../apps/vikunja/

resources:
  - secrets/db-secret.yaml

# Patch HelmChart to include overlay values
patchesJson6902:
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmChart
      name: vikunja
    patch: |-
      - op: add
        path: /spec/valuesFiles/-
        value: clusters/ocr1/overlays/apps/vikunja/values.yaml

commonLabels:
  app.kubernetes.io/name: vikunja
  app.kubernetes.io/part-of: vikunja
