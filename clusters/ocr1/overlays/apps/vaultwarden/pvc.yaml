apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/part-of: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  # Static binding to the hostPath PV: empty class opts out of the default
  # storage class, volumeName pins the exact PV so it cannot bind elsewhere.
  storageClassName: ""
  volumeName: vaultwarden-data
  resources:
    requests:
      storage: 2Gi
