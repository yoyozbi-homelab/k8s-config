apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jellyseerr

bases:
  - ../../../../../apps/jellyseerr

resources:
  - namespace.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: jellyseerr
    patch: |-
      - op: replace
        path: /spec/values/ingress/main/enabled
        value: true
      - op: add
        path: /spec/values/ingress/main/hosts
        value:
          - host: jellyseerr.yohanzbinden.ch
            paths:
              - path: /
                pathType: Prefix
      - op: replace
        path: /spec/vaules/persistence/settings/name
        value: jellyseerr-settings


commonLabels:
  app.kubernetes.io/name: jellyseerr
  app.kubernetes.io/part-of: jellyseerr
