apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jellyseerr

bases:
  - ../../../../../apps/jellyseerr

resources:
  - namespace.yaml

patches:
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmChart
      name: jellyseerr
    patch: |-
      - op: add
        path: /spec/valuesFiles/-
        value: values.yaml

