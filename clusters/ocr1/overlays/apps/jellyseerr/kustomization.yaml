apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jellyseerr

bases:
  - ../../../../../apps/jellyseerr

resources:
  - namespace.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: jellyseerr
    patch: |-
      - op: replace
        path: /spec/values
        value:
          replicaCount: 1
          image:
            repository: ghcr.io/fallenbagel/jellyseerr
            pullPolicy: IfNotPresent
          service:
            main:
              enabled: true
              type: ClusterIP
              ports:
                http:
                  port: 80
                  targetPort: 5055
          ingress:
            main:
              enabled: true
              hosts:
                - host: jellyseerr.yohanzbinden.ch
                  paths:
                    - path: /
                      pathType: Prefix
          persistence:
            config:
              enabled: true
              storageClass: longhorn
              size: 5Gi
              accessMode: ReadWriteOnce

commonLabels:
  app.kubernetes.io/name: jellyseerr
  app.kubernetes.io/part-of: jellyseerr
