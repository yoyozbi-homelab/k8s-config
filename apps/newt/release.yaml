apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
spec:
  interval: 5m
  chart:
    spec:
      chart: newt
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: fossorial
  values:
    newtInstances:
      - name: main-tunnel
        enabled: true
        auth:
          existingSecretName: "newt-main-tunnel-auth"
        acceptClients: true
