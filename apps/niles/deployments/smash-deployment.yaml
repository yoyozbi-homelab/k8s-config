# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smash-deployment
  labels:
    app: smash-deployment
spec:
  selector:
    matchLabels:
      app: smash-deployment
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:  smash-deployment
      labels:
        app: smash-deployment
    spec:
      nodeSelector:
        kubernetes.io/hostname: ocr1 # Since it uses hostPath

      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name: smash-deployment
        image: ghcr.io/yoyozbi/niles:v1.1 #{"$imagescan": "niles-scan"}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 150Mi
          limits:
            cpu: 100m
            memory: 150Mi
        volumeMounts:
        - name: config-smash
          mountPath: /usr/src/niles/config
        - name: stores-smash
          mountPath: /usr/src/niles/stores
        - name: svc
          mountPath: /svc
      volumes:
        - name: stores-smash
          hostPath:
            path: /data/niles/smash
        - name: config-smash
          secret:
            secretName: config-smash
        - name: svc
          secret:
            secretName: svc
      restartPolicy: Always
