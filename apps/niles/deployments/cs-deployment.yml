# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-deployment
  labels:
    app: cs-deployment
spec:
  selector:
    matchLabels:
      app: cs-deployment
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: cs-deployment
      labels:
        app: cs-deployment
    spec:
      nodeSelector:
        kubernetes.io/hostname: ocr1 # Since it uses hostPath

      # initContainers:
      # Init containers are exactly like regular containers, except:
      # - Init containers always run to completion.
      # - Each init container must complete successfully before the next one starts.
      containers:
        - name: cs-deployment
          image: ghcr.io/yoyozbi/niles:v2.2.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              cpu: 100m
              memory: 150Mi
          volumeMounts:
            - name: config-cs
              mountPath: /usr/src/niles/config
            - name: stores-cs
              mountPath: /usr/src/niles/stores
            - name: svc
              mountPath: /svc
      volumes:
        - name: stores-cs
          hostPath:
            path: /data/niles/cs
        - name: config-cs
          secret:
            secretName: config-cs
        - name: svc
          secret:
            secretName: svc
      restartPolicy: Always
