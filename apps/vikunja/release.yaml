apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bjw-s
spec:
  interval: 5m
  url: https://bjw-s-labs.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "4.6.2"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        containers:
          main:
            image:
              repository: vikunja/vikunja
              tag: 1.1.0
              pullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 3456
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    
    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          http:
            enabled: true
            port: 80
            targetPort: 3456
            protocol: TCP
    
    ingress:
      main:
        enabled: false
        className: "traefik"
    
    persistence:
      data:
        enabled: false
        type: emptyDir
        globalMounts:
          - path: /app/vikunja/files
