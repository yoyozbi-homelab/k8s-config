apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-php-config
data:
  # Loaded from /usr/local/etc/php/conf.d/. The zz- prefix makes it sort last so
  # these win over the image's own php.ini-production defaults (2M/8M).
  # 4G rather than 3.5G: multipart form encoding adds overhead on top of the file
  # itself, and post_max_size caps the whole request body, not just the file.
  zz-uploads.ini: |
    upload_max_filesize = 4G
    post_max_size = 4G
    memory_limit = 512M
    max_execution_time = 3600
    max_input_time = 3600
