apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        containers:
          main:
            image:
              repository: wordpress
              # Matches the WordPress version the teamsolid.ch backup was taken
              # from (package.json reports 7.1.2). Restoring that database into
              # older code means the schema is ahead of the code that reads it.
              tag: 7.1.2-apache
              pullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 80
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            # Probe a 43-byte static asset, not "/".
            #
            # "/" is a full Elementor render - the most expensive request on the
            # site - and the chart defaults timeoutSeconds to 1, which produced
            # "context deadline exceeded" on this 2-core node. Worse, "/" needs
            # mariadb, so a database blip returns 500, trips LIVENESS and
            # restarts apache; while the pod restarts the Service has no
            # endpoint and traefik answers "no available server". Restarting the
            # web server does not fix a database outage.
            #
            # Liveness should only answer "is this container wedged". With a
            # single replica, readiness gating on "/" also gains nothing:
            # dropping the only endpoint turns a WordPress 500 into a traefik
            # 503, so let WordPress serve its own error and recover when the
            # database returns. /readme.html is not usable - Solid Security 403s
            # it - and blank.gif is served by apache without touching PHP.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /wp-includes/images/blank.gif
                    port: http
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /wp-includes/images/blank.gif
                    port: http
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            env:
              WORDPRESS_DB_HOST: mariadb.wordpress.svc.cluster.local
              WORDPRESS_DB_NAME: wordpress
              WORDPRESS_DB_USER: wordpress
              WORDPRESS_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wordpress-db-secret
                    key: password

    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          http:
            enabled: true
            port: 80
            targetPort: http
            protocol: TCP

    ingress:
      main:
        enabled: false
        className: "traefik"

    persistence:
      data:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/www/html
