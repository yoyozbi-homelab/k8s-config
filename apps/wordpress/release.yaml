apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        containers:
          main:
            image:
              repository: wordpress
              # Matches the WordPress version the teamsolid.ch backup was taken
              # from (package.json reports 7.1.2). Restoring that database into
              # older code means the schema is ahead of the code that reads it.
              tag: 7.1.2-apache
              pullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 80
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                path: /
                type: HTTP
              readiness:
                enabled: true
                path: /
                type: HTTP
            env:
              WORDPRESS_DB_HOST: mariadb.wordpress.svc.cluster.local
              WORDPRESS_DB_NAME: wordpress
              WORDPRESS_DB_USER: wordpress
              WORDPRESS_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wordpress-db-secret
                    key: password

    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          http:
            enabled: true
            port: 80
            targetPort: http
            protocol: TCP

    ingress:
      main:
        enabled: false
        className: "traefik"

    persistence:
      data:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/www/html
