apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The mariadb image runs as uid/gid 999. The data volume is a hostPath in the
    # ocr1 overlay, so without fsGroup the initdb step cannot write to it.
    defaultPodOptions:
      securityContext:
        fsGroup: 999

    controllers:
      main:
        type: deployment
        replicas: 1
        # Recreate: the data dir is ReadWriteOnce and a second mysqld must never
        # come up against the same files during a rollout.
        strategy: Recreate
        containers:
          main:
            image:
              repository: mariadb
              tag: "11.4"
              pullPolicy: IfNotPresent
            ports:
              - name: mysql
                containerPort: 3306
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
            env:
              MARIADB_DATABASE: wordpress
              MARIADB_USER: wordpress
              MARIADB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wordpress-db-secret
                    key: password
              MARIADB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wordpress-db-secret
                    key: root-password

    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          mysql:
            enabled: true
            port: 3306
            targetPort: mysql
            protocol: TCP

    persistence:
      data:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/lib/mysql
