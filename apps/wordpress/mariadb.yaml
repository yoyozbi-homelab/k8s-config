apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "5.2.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The mariadb image runs as uid/gid 999. The data volume is a hostPath in the
    # ocr1 overlay, so without fsGroup the initdb step cannot write to it.
    defaultPodOptions:
      securityContext:
        fsGroup: 999

    controllers:
      main:
        type: deployment
        replicas: 1
        # Recreate: the data dir is ReadWriteOnce and a second mysqld must never
        # come up against the same files during a rollout.
        strategy: Recreate
        containers:
          main:
            image:
              repository: mariadb
              tag: "11.8"
              pullPolicy: IfNotPresent
            ports:
              - name: mysql
                containerPort: 3306
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
            # An exec probe rather than TCP: a TCP check only proves 3306 is
            # listening, so it reports healthy while mariadb is still refusing
            # queries - and each bare connect-then-close makes mariadb log
            # "Aborted connection ... closed normally without authentication",
            # roughly 12 lines a minute of pure noise. healthcheck.sh ships in
            # the image and is what the tiny2 docker role already uses.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - healthcheck.sh
                      - --connect
                      - --innodb_initialized
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - healthcheck.sh
                      - --connect
                      - --innodb_initialized
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            env:
              MARIADB_DATABASE: wordpress
              MARIADB_USER: wordpress
              MARIADB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wordpress-db-secret
                    key: password
              MARIADB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wordpress-db-secret
                    key: root-password

    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          mysql:
            enabled: true
            port: 3306
            targetPort: mysql
            protocol: TCP

    persistence:
      data:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/lib/mysql
