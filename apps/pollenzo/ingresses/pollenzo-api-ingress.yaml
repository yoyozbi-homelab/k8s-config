apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pollenzo-api-ingressroute
  labels:
    app.kubernetes.io/name: pollenzo
    app.kubernetes.io/part-of: pollenzo
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`INGRESS_HOST_PLACEHOLDER`) && !PathPrefix(`/actuator`)
      kind: Rule
      services:
        - name: pollenzo-api
          port: 8080
