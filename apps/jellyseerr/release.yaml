apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: '5.0.1'
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        containers:
          main:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.4.1
              pullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 5055
                protocol: TCP
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    
    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          http:
            enabled: true
            port: 80
            targetPort: http
            protocol: TCP
    
    ingress:
      main:
        enabled: false
        className: "traefik"
    
    persistence:
      config:
        enabled: false
        type: persistentVolumeClaim
        existingClaim: jellyseerr-config
        globalMounts:
          - path: /app/config

