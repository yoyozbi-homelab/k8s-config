replicaCount: 1

image:
  repository: ghcr.io/fallenbagel/jellyseerr
  pullPolicy: IfNotPresent

service:
  main:
    enabled: true
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 5055

ingress:
  main:
    enabled: true
    hosts:
      - host: TO_BE_OVERRIDEN
        paths:
          - path: /
            pathType: Prefix

persistence:
  config:
    enabled: true
    type: emptyDir
